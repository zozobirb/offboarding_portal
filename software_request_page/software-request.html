<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <link rel="stylesheet" href="./stylesheet.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoe Software Request Form</title>
</head>
<body>
    


<div class="form-container">

<div class="form-display">
    <button class="cancel-btn">Cancel</button>
    <h2>Software Request Form</h2>
    <form action="#" method="POST">
        
        
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="john@example.com" required>
        </div>

         <div class="form-group">
            <label for="position">Your Position</label>
            <input type="position" id="position" name="position" placeholder="Intern Position" required>
        </div>

          <div class="form-group">
            <label for="notes">Link</label>
            <textarea id="eval" name="notes" placeholder="Paste link here"></textarea>
        </div>
        <div class="form-group">
            <label for="notes">Software Request</label>
            <textarea id="eval" name="notes" placeholder="Software"></textarea>
        </div>

        <button type="submit" id="sub-btn">Submit Request</button>
    </form>
</div>

</div>




</body>
</html>
